auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_concurrent_streams: 1000
  log_level: info
  log_format: json
  # Defaults are 30s/30s. The write timeout caps how long Loki has to finish
  # writing a response — anything longer (e.g. cold 24h+ correlate queries)
  # gets cut off mid-stream regardless of upstream timeouts. 15m gives
  # pre-S3-cutover wide-window queries (3d/7d) room to complete slowly under
  # reduced parallelism (see querier/limits below). Matches nginx and
  # Grafana ceilings (also bumped to 900s).
  http_server_read_timeout: 15m
  http_server_write_timeout: 15m

common:
  instance_addr: "::"
  path_prefix: /loki
  storage:
    # Default backend (Tigris — Railway's S3-compatible bucket service).
    # Non-blocking HTTP I/O so query parallelism doesn't pin OS threads the
    # way filesystem reads did. Credentials and endpoint resolved from
    # Railway env vars set on the Loki service ($S3_BUCKET, $S3_ENDPOINT,
    # $S3_ACCESS_KEY, $S3_SECRET_KEY) — all reference the "Loki Bucket"
    # plugin.
    s3:
      endpoint: ${S3_ENDPOINT}
      bucketnames: ${S3_BUCKET}
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      region: auto
      s3forcepathstyle: true
      insecure: false
      http_config:
        # Default is 1m30s. Loki's legacy S3 client uses Go's
        # http.Transport defaults under the hood — MaxIdleConnsPerHost
        # is 2, so once a burst of concurrent chunk GETs finishes, all
        # but 2 connections to Tigris go straight to TIME_WAIT. The
        # next burst pays a TLS handshake on every new conn. 5m keeps
        # the conns we DO have alive across consecutive correlate
        # sub-query batches in the same session, partially mitigating
        # the handshake tax. The proper fix is migrating to
        # use_thanos_objstore: true (exposes max-idle-connections-
        # per-host); tracked separately.
        idle_conn_timeout: 5m
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  # cache_results defaults to false, which means the embedded results_cache
  # below is allocated but never consulted. align_queries_with_step makes
  # near-identical dashboard queries hash to the same cache key instead of
  # missing because their step boundaries differ by milliseconds.
  cache_results: true
  align_queries_with_step: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        # Default is ~1GB. Was capped at 100MB which made eviction
        # aggressive on a workload with many distinct queries.
        max_size_mb: 1024

limits_config:
  # 60-day retention. Compactor below actually enforces it (the previous
  # value of 168h was set on limits_config but `compactor.retention_enabled`
  # was unset, so retention was advertised but never deleted anything).
  retention_period: 1440h
  max_entries_limit_per_query: 50000
  allow_structured_metadata: true
  discover_service_name: []
  # Frontend fan-out caps. These bound the queue depth the query
  # frontend will produce per range query — they do NOT control
  # concurrent execution (that's querier.max_concurrent below) and do
  # NOT participate in the memory pressure that OOMed #11. Queued sub-
  # query state is KBs each, completed results buffered for merge are
  # a few KB each. tsdb_max_query_parallelism=256 was actively
  # constraining 7d range queries (1008 sub-queries → 4 sequential
  # frontend rounds); 1024 lets them queue all at once. max_query_
  # parallelism is the per-tenant cap; uniform with the tsdb knob.
  split_queries_by_interval: 10m
  max_query_parallelism: 256          # default 32
  tsdb_max_query_parallelism: 1024    # default 128
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service
            - environment
            - runtime
  # Backend services emit `severity_text` (OTel) and mobile logs emit
  # `level` as structured metadata. With explicit fields present, Loki's
  # field-priority match wins and the body-text heuristic never runs, so
  # the historical mis-detection concern does not apply. `detected_level`
  # is the canonical severity field for `fieldy-observe logs --level` and
  # for Grafana Logs panel coloring.
  discover_log_levels: true
  reject_old_samples: false
  # Per-sub-query timeout (default 1m). At split=30m a single sub-query has
  # to chew through more chunks; 3m lets cold filesystem-backed sub-queries
  # complete without failing. Bounded by max_concurrent below so blocked
  # goroutines can't accumulate past the OS thread cap.
  query_timeout: 3m

schema_config:
  configs:
    # All chunks and TSDB indexes live in Tigris (S3). Pre-2026-04-21
    # filesystem chunks were deleted along with the legacy schema entry —
    # queries against earlier time ranges return empty.
    - from: 2026-04-21
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_s3_
        period: 24h

pattern_ingester:
  enabled: true

querier:
  # Default is 10. With chunks S3-only, chunk fetches are non-blocking
  # HTTP and don't pin OS threads. Was 32; #11 jumped to 128 and OOMed
  # the 32 GB container — each in-flight metadata-sweep sub-query holds
  # ~150-250 MB of decoded chunks + structured metadata, so 128 ×
  # ~200 MB ≈ 25 GB peak query memory + baseline blew past the limit.
  # 64 is the safe halfway: query log showed queue_time of 8-11s at
  # max_concurrent=32, this cuts it ~in half while staying well clear
  # of OOM (64 × ~200 MB ≈ 13 GB peak in 32 GB container).
  max_concurrent: 64

ingester:
  # Mobile log uploads arrive with capture-time timestamps that can lag
  # wall-clock by many hours when a device syncs late. The ingester's accept
  # window for out-of-order entries is max_chunk_age/2, so 48h gives a 24h
  # tolerance for delayed mobile sync — covers the worst observed rejection
  # (~19h stale) with headroom. Default is 2h (= 1h window). Memory cost is
  # negligible: chunks still flush on chunk_target_size (1.5 MB) and
  # chunk_idle_period (30m), so max_chunk_age only affects low-rate streams.
  max_chunk_age: 48h

ruler:
  # Pin ruler files to the filesystem volume explicitly. Was previously
  # inheriting from `common.storage.filesystem.rules_directory`; that
  # block went away when we switched the chunk default to S3, and the
  # ruler doesn't have its own S3 config here so we declare it locally.
  storage:
    type: local
    local:
      directory: /loki/rules
  alertmanager_url: http://localhost:9093

compactor:
  # Actually enforce `limits_config.retention_period`. Without this block
  # the compactor runs but never deletes — the previous 168h retention
  # setting was advertised but inert. `delete_request_store: s3` keeps
  # the compactor's own delete-tracking data on the same backend as new
  # chunks, so the filesystem volume stays read-only for legacy data.
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

frontend:
  encoding: protobuf

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/analytics/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
